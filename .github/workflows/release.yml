name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  preflight:
    name: 发布前版本校验
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag 必须是严格 SemVer：vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} 与应用版本 v${VERSION} 不一致" >&2
            exit 1
          fi

          npm run test:frontend

          git fetch origin main
          TAG_SHA="$(git rev-parse "$GITHUB_SHA^{commit}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TAG_SHA" != "$MAIN_SHA" ]]; then
            echo "Tag 必须指向 origin/main 当前提交：tag=${TAG_SHA}, main=${MAIN_SHA}" >&2
            exit 1
          fi

  build-tauri:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage"
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            args: "--target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage"
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          # 兜底：GitHub runner 的 azure.archive.ubuntu.com 镜像偶发抽风（曾导致 update 卡 6h 被取消），
          # 换回 archive.ubuntu.com 主源，并给 update 加超时 + 重试。
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} + 2>/dev/null || true
          for i in 1 2 3; do
            if sudo timeout 180 apt-get update; then break; fi
            echo "::warning::apt-get update 失败 (尝试 $i/3)，重试..."
            if [[ $i -eq 3 ]]; then echo "::error::apt-get update 三次均失败"; exit 1; fi
            sleep 5
          done
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm \
            rpm2cpio \
            cpio \
            binutils

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type check
        run: npm run check

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend assets for Rust tests
        run: npm run build

      - name: Run Rust format check
        run: cargo fmt --all -- --check

      - name: Run Rust check
        run: cargo check --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Build application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          # CI 中统一使用 ad-hoc 身份避免固定证书导致的跨 runner 构建不稳定
          if [[ "${{ matrix.platform }}" == macos* ]]; then
            export APPLE_SIGNING_IDENTITY="-"
          fi

          npm run tauri build -- ${{ matrix.args }}

      - name: List build output
        if: always()
        shell: bash
        run: |
          if [[ -d "target" ]]; then
            echo "=== target ==="
            find target -maxdepth 5 -type f \( -name "*.app" -o -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.sig" \) 2>/dev/null || true
          else
            echo "No build output directory found in target."
          fi

      - name: Rename macOS updater assets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "target" ]]; then
            echo "No build output, skipping rename"
            exit 0
          fi

          normalize_name() {
            local filename="$1"
            printf '%s' "${filename// /_}"
          }

          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            ARCH_SUFFIX="aarch64"
          else
            ARCH_SUFFIX="x64"
          fi

          find target -type f -path "*/release/bundle/macos/*.app.tar.gz" 2>/dev/null | while read -r file; do
            dir="$(dirname "$file")"
            base="$(basename "$file" ".app.tar.gz")"
            normalized_base="$(normalize_name "$base")"
            renamed="${dir}/${normalized_base}_${ARCH_SUFFIX}.app.tar.gz"
            mv "$file" "$renamed"

            if [[ -f "${file}.sig" ]]; then
              mv "${file}.sig" "${renamed}.sig"
            fi
          done

          find target -type f -path "*/release/bundle/dmg/*.dmg" 2>/dev/null | while read -r file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"
            normalized_name="$(normalize_name "$name")"
            renamed="${dir}/${normalized_name}"
            if [[ "$file" != "$renamed" ]]; then
              mv "$file" "$renamed"
            fi
          done

      - name: Rename Windows installer assets
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "target" ]]; then
            echo "No build output, skipping rename"
            exit 0
          fi

          normalize_name() {
            local filename="$1"
            printf '%s' "${filename// /_}"
          }

          find target -type f -path "*/release/bundle/nsis/*.exe" 2>/dev/null | while read -r file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"
            normalized_name="$(normalize_name "$name")"
            renamed="${dir}/${normalized_name}"
            if [[ "$file" != "$renamed" ]]; then
              mv "$file" "$renamed"
            fi

            if [[ -f "${file}.sig" ]]; then
              mv "${file}.sig" "${renamed}.sig"
            fi
          done

      - name: Package Windows portable (免安装版)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          # 便携版 = Rust 主程序 exe（前端已嵌入，需 WebView2 运行时，Win10/11 自带）
          EXE="$(find target -name "Work_Review.exe" -path "*/release/*" -not -path "*/build/*" -not -path "*/deps/*" 2>/dev/null | head -n 1 || true)"
          if [[ -z "$EXE" || ! -f "$EXE" ]]; then
            echo "Work_Review.exe 未找到，无法生成便携版" >&2
            exit 1
          fi
          DIR="$(dirname "$EXE")"
          printf 'Work Review 便携版\n\n- 双击 Work_Review.exe 直接运行，无需安装\n- 需要 WebView2 运行时（Windows 10/11 已自带；旧系统请自行安装）\n- 数据保存在 %%APPDATA%%\\work-review\n' > "$DIR/PORTABLE_README.txt"
          # Windows runner 不带 zip 命令，用 PowerShell 的 Compress-Archive 打包（行为等同 zip -j，文件平铺到 zip 根）
          (cd "$DIR" && rm -f Work_Review_portable_x64.zip && powershell.exe -NoProfile -Command "Compress-Archive -Path Work_Review.exe,PORTABLE_README.txt -DestinationPath Work_Review_portable_x64.zip -Force")

      - name: Rename Linux bundle assets
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "target" ]]; then
            echo "No build output, skipping rename"
            exit 0
          fi

          normalize_name() {
            local filename="$1"
            printf '%s' "${filename// /_}"
          }

          find target -type f -path "*/release/bundle/appimage/*.AppImage" 2>/dev/null | while read -r file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"
            normalized_name="$(normalize_name "$name")"
            renamed="${dir}/${normalized_name}"
            if [[ "$file" != "$renamed" ]]; then
              mv "$file" "$renamed"
            fi
          done

          find target -type f -path "*/release/bundle/deb/*.deb" 2>/dev/null | while read -r file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"
            normalized_name="$(normalize_name "$name")"
            renamed="${dir}/${normalized_name}"
            if [[ "$file" != "$renamed" ]]; then
              mv "$file" "$renamed"
            fi
          done

          find target -type f -path "*/release/bundle/rpm/*.rpm" 2>/dev/null | while read -r file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"
            normalized_name="$(normalize_name "$name")"
            renamed="${dir}/${normalized_name}"
            if [[ "$file" != "$renamed" ]]; then
              mv "$file" "$renamed"
            fi
          done

      - name: Verify required artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "target" ]]; then
            echo "Build output directory not found (target)." >&2
            exit 1
          fi

          require_file() {
            local pattern="$1"
            local label="$2"
            local match
            match="$(find target -type f -path "$pattern" 2>/dev/null | sort | head -n 1 || true)"
            if [[ -z "$match" ]]; then
              echo "缺少 ${label}: ${pattern}" >&2
              echo "Available bundle files:" >&2
              find target -type f -path "*/bundle/*" 2>/dev/null | head -50 >&2 || true
              exit 1
            fi
            echo "${label}: ${match}"
          }

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              require_file "*/release/bundle/macos/*_aarch64.app.tar.gz" "macOS aarch64 自动更新包"
              require_file "*/release/bundle/macos/*_aarch64.app.tar.gz.sig" "macOS aarch64 自动更新签名"
              require_file "*/release/bundle/dmg/*.dmg" "macOS aarch64 DMG"
              ;;
            x86_64-apple-darwin)
              require_file "*/release/bundle/macos/*_x64.app.tar.gz" "macOS x64 自动更新包"
              require_file "*/release/bundle/macos/*_x64.app.tar.gz.sig" "macOS x64 自动更新签名"
              require_file "*/release/bundle/dmg/*.dmg" "macOS x64 DMG"
              ;;
            x86_64-unknown-linux-gnu)
              require_file "*/release/bundle/appimage/*.AppImage" "Linux x64 AppImage"
              require_file "*/release/bundle/deb/*.deb" "Linux x64 DEB"
              require_file "*/release/bundle/rpm/*.rpm" "Linux x64 RPM"
              ;;
            aarch64-unknown-linux-gnu)
              require_file "*/release/bundle/appimage/*.AppImage" "Linux ARM64 AppImage"
              require_file "*/release/bundle/deb/*.deb" "Linux ARM64 DEB"
              require_file "*/release/bundle/rpm/*.rpm" "Linux ARM64 RPM"
              ;;
            x86_64-pc-windows-msvc)
              require_file "*/release/bundle/nsis/*.exe" "Windows 安装包"
              require_file "*/release/bundle/nsis/*.sig" "Windows 安装包签名"
              require_file "*/release/Work_Review_portable_x64.zip" "Windows 便携包"
              ;;
          esac

      - name: Verify Linux GLIBC compatibility
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        env:
          MAX_GLIBC_VERSION: "2.35"
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            find target -type f \
              \( -path "*/release/bundle/appimage/*.AppImage" \
              -o -path "*/release/bundle/deb/*.deb" \
              -o -path "*/release/bundle/rpm/*.rpm" \) \
              | sort
          )
          if ((${#artifacts[@]} == 0)); then
            echo "没有可检查的 Linux 发布产物" >&2
            exit 1
          fi
          bash scripts/check-linux-glibc.sh \
            --max "$MAX_GLIBC_VERSION" \
            --binary-name Work_Review \
            "${artifacts[@]}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/dmg/*.sig
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.app.tar.gz.sig
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/nsis/*.sig
            target/**/Work_Review_portable_*.zip
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          pattern: "release-assets-*"
          merge-multiple: true

      - name: Extract changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          if [[ -z "$BODY" ]]; then
            BODY="版本 ${VERSION} 更新"
          fi

          # 多语言 release notes（cc-switch 风格）：中文主体取自 CHANGELOG；
          # 若存在 docs/release-notes/vX.Y.Z-en.md / -tw.md，在顶部追加语言切换链接。
          # 详见 docs/release-notes/README.md。无对应文件则只保留中文主体（向后兼容）。
          EN_FILE="docs/release-notes/v${VERSION}-en.md"
          TW_FILE="docs/release-notes/v${VERSION}-tw.md"
          LANG_LINKS=""
          if [[ -f "$EN_FILE" ]]; then
            LANG_LINKS="[English →](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${EN_FILE})"
          fi
          if [[ -f "$TW_FILE" ]]; then
            if [[ -n "$LANG_LINKS" ]]; then
              LANG_LINKS="${LANG_LINKS} | "
            fi
            LANG_LINKS="${LANG_LINKS}[繁體中文 →](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${TW_FILE})"
          fi
          if [[ -n "$LANG_LINKS" ]]; then
            BODY="**${LANG_LINKS}**

          ---

          ${BODY}"
          fi

          BODY="${BODY}

          ### macOS 安装说明
          首次打开可能提示「已损坏，无法打开」，请执行：
          \`\`\`bash
          sudo xattr -rd com.apple.quarantine '/Applications/Work Review.app'
          \`\`\`"

          printf '%s\n' "$BODY" > release_notes.md

      - name: Build updater.json from signatures
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"
          NOTES="$(cat release_notes.md)"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAC_AARCH64_FILE="$(find all-artifacts -type f -name '*_aarch64.app.tar.gz' | sort | head -n 1 || true)"
          MAC_X64_FILE="$(find all-artifacts -type f -name '*_x64.app.tar.gz' | sort | head -n 1 || true)"
          WINDOWS_FILE="$(find all-artifacts -type f \( -name '*setup.exe' -o -name '*installer.exe' \) ! -name '*.sig' | sort | head -n 1 || true)"

          require_asset() {
            local asset_file="$1"
            local signature_file="$2"
            local label="$3"

            if [[ -z "$asset_file" || ! -f "$asset_file" ]]; then
              echo "缺少 ${label} 产物" >&2
              exit 1
            fi

            if [[ ! -f "$signature_file" ]]; then
              echo "缺少 ${label} 签名: ${signature_file}" >&2
              exit 1
            fi

            echo "${label}: ${asset_file}"
          }

          require_asset "$MAC_AARCH64_FILE" "${MAC_AARCH64_FILE}.sig" "darwin-aarch64"
          require_asset "$MAC_X64_FILE" "${MAC_X64_FILE}.sig" "darwin-x86_64"
          require_asset "$WINDOWS_FILE" "${WINDOWS_FILE}.sig" "windows-x86_64"

          json="$(jq -n \
            --arg version "$VER" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}')"

          add_platform() {
            local platform_key="$1"
            local asset_file="$2"
            local signature_file="$3"
            local base_url="$4"

            if [[ -z "$asset_file" || ! -f "$asset_file" || ! -f "$signature_file" ]]; then
              echo "skip ${platform_key}"
              return
            fi

            local signature
            signature="$(tr -d '\r\n' < "$signature_file")"
            local asset_name
            asset_name="$(basename "$asset_file")"

            variant_json="$(jq \
              --arg key "$platform_key" \
              --arg url "${base_url}/${asset_name}" \
              --arg signature "$signature" \
              '.platforms[$key] = { url: $url, signature: $signature }' \
              <<<"$variant_json")"
          }

          # 为每个代理前缀生成独立的 updater JSON 文件
          # 格式: "前缀 文件名"（前缀为空表示直连 GitHub）
          PROXY_VARIANTS=(
            " updater.json"
            "https://gh-proxy.cn/ updater-ghproxy.json"
            "https://gh-proxy.com/ updater-ghp.json"
          )

          for variant in "${PROXY_VARIANTS[@]}"; do
            proxy_prefix="${variant%% *}"
            output_file="${variant##* }"

            if [[ -z "$proxy_prefix" ]]; then
              VARIANT_BASE="${DOWNLOAD_BASE}"
            else
              VARIANT_BASE="${proxy_prefix}${DOWNLOAD_BASE}"
            fi

            variant_json="$json"

            add_platform "darwin-aarch64" "$MAC_AARCH64_FILE" "${MAC_AARCH64_FILE}.sig" "$VARIANT_BASE"
            add_platform "darwin-x86_64" "$MAC_X64_FILE" "${MAC_X64_FILE}.sig" "$VARIANT_BASE"
            add_platform "windows-x86_64" "$WINDOWS_FILE" "${WINDOWS_FILE}.sig" "$VARIANT_BASE"

            if [[ "$(jq '.platforms | length' <<<"$variant_json")" -ne 3 ]]; then
              echo "自动更新平台数量异常 (${output_file})，期望 3 个，实际为 $(jq '.platforms | length' <<<"$variant_json")" >&2
              exit 1
            fi

            printf '%s\n' "$variant_json" > "$output_file"
            echo "=== ${output_file} ==="
            cat "$output_file"
          done

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: "Work_Review ${{ github.ref_name }}"
          bodyFile: release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          # 按扩展名精确匹配文件，避免 all-artifacts/**/* 把合并后的
          # target-triple 目录（如 x86_64-unknown-linux-gnu/）也当作产物上传，
          # 触发 "Artifact is a directory" 错误。
          artifacts: "all-artifacts/**/*.AppImage,all-artifacts/**/*.deb,all-artifacts/**/*.rpm,all-artifacts/**/*.exe,all-artifacts/**/*.exe.sig,all-artifacts/**/*.dmg,all-artifacts/**/*.app.tar.gz,all-artifacts/**/*.app.tar.gz.sig,all-artifacts/**/Work_Review_portable_*.zip,updater.json,updater-ghproxy.json,updater-ghp.json"
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          makeLatest: legacy
