[package]
name = "work-review"
version = "1.1.3-rc.2"
description = "个人工作回顾与AI日报助手"
authors = ["WorkReview Team"]
edition = "2021"
workspace = "../"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 内部共享库
work-review-core = { path = "../crates/core" }

# Tauri 核心
tauri = { version = "2.9", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = { version = "2" }

# 异步运行时
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
rusqlite = { version = "0.30", features = ["bundled"] }
base64 = "0.21"

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "socks"] }

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 正则表达式
regex = "1.10"

# 日志
log = "0.4"
env_logger = "0.10"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# 其他
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
dirs = "5.0"
image = "0.25.9"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
auto-launch = "0.6.0"

# S3 SigV4 签名 / Bot 签名
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
# 常量时间比较（防签名时序侧信道）
subtle = "2.5"

# 企业微信 AES 加解密 / 智能机器人长连接
aes = "0.8"
cbc = "0.1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# 平台特定依赖 - Windows
[target.'cfg(windows)'.dependencies]
windows-capture = "1.5"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "tlhelp32", "psapi", "handleapi", "winnt", "winbase", "sysinfoapi", "wingdi", "libloaderapi", "shellapi", "commctrl", "commoncontrols"] }
uiautomation = "0.24"

# 平台特定依赖 - macOS
[target.'cfg(target_os = "macos")'.dependencies]
screenshots = "0.8"
cocoa = "0.25"
objc = "0.2"
block = "0.1.6"
core-graphics = "0.23"
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21.0", features = ["xlib", "xinput"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Compatibility shim for old objc macros that still expand cfg(feature = "cargo-clippy")
cargo-clippy = []
